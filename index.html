1. Acceptance of Terms / शर्तों की स्वीकृति
By registering on the Seller app and tapping "I Agree" or a similar button, the seller confirms having read, understood, and accepted these terms. If the seller does not agree, they should not use the app.
Seller ऐप पर रजिस्टर करते समय "स्वीकार करें" या किसी समान बटन को दबाकर विक्रेता इन नियमों को पढ़ने, समझने और स्वीकार करने की पुष्टि करता है। यदि विक्रेता सहमत नहीं है, तो उसे ऐप का उपयोग नहीं करना चाहिए।

2. Seller Eligibility & Account / विक्रेता पात्रता एवं खाता
The seller must provide accurate shop name, owner name, mobile number, pickup location, and (where applicable) GST and FSSAI registration numbers. The seller is responsible for keeping their account and login details confidential and for all actions taken from their account.
विक्रेता को सही दुकान का नाम, मालिक का नाम, मोबाइल नंबर, पिकअप स्थान, और (जहाँ लागू हो) GST एवं FSSAI पंजीकरण नंबर देना होगा। विक्रेता अपने खाते और लॉगिन विवरण को गोपनीय रखने तथा अपने खाते से किए गए सभी कार्यों के लिए जिम्मेदार है।

3. Application Review & Approval / आवेदन समीक्षा एवं अनुमोदन
A seller's shop signup, and every product/dish added or edited afterward, is reviewed by FNGo before it becomes visible to customers. FNGo may approve, reject, or request changes to any listing, and is not obligated to approve every submission.
विक्रेता की दुकान का साइनअप, और उसके बाद जोड़ा या संपादित किया गया हर उत्पाद/व्यंजन, ग्राहकों को दिखने से पहले FNGo द्वारा समीक्षा किया जाता है। FNGo किसी भी लिस्टिंग को approve, reject, या उसमें बदलाव का अनुरोध कर सकता है, और हर submission को approve करने के लिए बाध्य नहीं है।

4. Product Listings & Accuracy / उत्पाद सूची एवं सटीकता
The seller is solely responsible for the accuracy of product/dish names, descriptions, photos, prices, MRP, GST rate, and stock/availability shown on the app. Prices shown to customers must not exceed applicable MRP, and stock status (Active/Out of Stock/Inactive) must be kept up to date.
उत्पाद/व्यंजन के नाम, विवरण, फोटो, कीमत, MRP, GST दर, और स्टॉक/उपलब्धता की सटीकता के लिए विक्रेता पूरी तरह जिम्मेदार है। ग्राहकों को दिखाई गई कीमत लागू MRP से अधिक नहीं होनी चाहिए, और स्टॉक स्थिति (Active/Out of Stock/Inactive) अद्यतन रखनी होगी।

5. Order Acceptance & Fulfilment / ऑर्डर स्वीकृति एवं पूर्ति
When a new order arrives, the seller must Accept or Reject it within a reasonable time, and — once accepted — prepare/pack the order correctly and mark it "Packed — Ready for Pickup" promptly so a rider can collect it. Repeated unreasonable rejections, delays, or incorrectly packed orders may affect the seller's standing on the platform.
नया ऑर्डर आने पर, विक्रेता को उचित समय के भीतर Accept या Reject करना होगा, और — स्वीकार करने के बाद — ऑर्डर को सही ढंग से तैयार/पैक करके तुरंत "Packed — Ready for Pickup" मार्क करना होगा ताकि राइडर उसे उठा सके। बार-बार अनुचित रिजेक्शन, देरी, या गलत तरीके से पैक किए गए ऑर्डर विक्रेता की प्लेटफ़ॉर्म पर स्थिति को प्रभावित कर सकते हैं।

6. Commission, Earnings & Payouts / कमीशन, कमाई एवं भुगतान
FNGo deducts a commission (as set in the app, or a seller-specific rate if agreed) from each completed order's value; the remainder is the seller's earning. Payouts are made through the payment method and process shown in the Seller app (Payouts section), and FNGo may pay any amount up to what's available, including in partial instalments.
FNGo हर पूर्ण ऑर्डर के मूल्य से एक कमीशन (ऐप में सेट अनुसार, या सहमति होने पर विक्रेता-विशिष्ट दर) काटता है; शेष राशि विक्रेता की कमाई है। भुगतान Seller ऐप (Payouts सेक्शन) में दिखाए गए भुगतान माध्यम एवं प्रक्रिया के अनुसार किया जाएगा, और FNGo उपलब्ध राशि तक कोई भी राशि, आंशिक किश्तों सहित, भुगतान कर सकता है।

7. Returns, Refunds & Quality Disputes / वापसी, रिफंड एवं गुणवत्ता विवाद
If a customer returns a product, or raises a valid complaint (e.g. damaged, spoiled, wrong item, or quality issue) about an order from this seller, FNGo may issue a refund or compensation voucher to the customer. In such cases, FNGo may deduct an equivalent amount from the seller's pending or future earnings/payout, corresponding to that seller's share of the refunded order value. FNGo will use reasonable judgement in reviewing such complaints before deducting.
यदि कोई ग्राहक उत्पाद वापस करता है, या किसी ऑर्डर को लेकर कोई वैध शिकायत (जैसे क्षतिग्रस्त, खराब, गलत आइटम, या गुणवत्ता संबंधी समस्या) दर्ज करता है, तो FNGo ग्राहक को रिफंड या मुआवज़ा वाउचर दे सकता है। ऐसे मामलों में, FNGo विक्रेता के pending या भविष्य की कमाई/भुगतान से — रिफंड की गई राशि में उस विक्रेता के हिस्से के बराबर — कटौती कर सकता है। कटौती से पहले FNGo ऐसी शिकायतों की उचित समीक्षा करेगा।

8. Cancellations by Seller / विक्रेता द्वारा कैंसिलेशन
A seller may reject an order (e.g. item unavailable) before accepting it, but should avoid cancelling after marking it "Packed". Frequent cancellations after acceptance may be treated as a policy violation under Section 5.
विक्रेता किसी ऑर्डर को accept करने से पहले reject कर सकता है (जैसे आइटम अनुपलब्ध), लेकिन "Packed" मार्क करने के बाद कैंसिल करने से बचना चाहिए। स्वीकृति के बाद बार-बार कैंसिलेशन को Section 5 के तहत नीति उल्लंघन माना जा सकता है।

9. Food Safety & Legal Compliance / खाद्य सुरक्षा एवं कानूनी अनुपालन
Restaurant/food sellers must hold a valid FSSAI licence (where legally required) and follow applicable food safety and hygiene standards. All sellers must comply with applicable laws regarding the goods they sell, including packaging, labelling, and expiry-date requirements.
रेस्टोरेंट/खाद्य विक्रेताओं के पास वैध FSSAI लाइसेंस (जहाँ कानूनी रूप से आवश्यक हो) होना चाहिए और लागू खाद्य सुरक्षा एवं स्वच्छता मानकों का पालन करना चाहिए। सभी विक्रेताओं को अपने बेचे जाने वाले सामान से संबंधित लागू कानूनों — जिसमें पैकेजिंग, लेबलिंग, और expiry-date आवश्यकताएँ शामिल हैं — का पालन करना होगा।

10. Prohibited Items & Conduct / निषिद्ध वस्तुएँ एवं आचरण
The seller must not list illegal, counterfeit, expired, or unsafe goods, and must not misuse customer data, manipulate ratings/reviews, or use the app for any fraudulent purpose.
विक्रेता को अवैध, नकली, expired, या असुरक्षित सामान सूचीबद्ध नहीं करना चाहिए, और ग्राहक डेटा का दुरुपयोग, रेटिंग/समीक्षाओं में हेरफेर, या ऐप का किसी धोखाधड़ी वाले उद्देश्य के लिए उपयोग नहीं करना चाहिए।

11. Suspension & Termination / निलंबन एवं समाप्ति
FNGo may suspend or deactivate a seller's account for reasons including repeated quality complaints, unsettled disputes, incorrect pricing/stock, expired documents, fraud, or at the seller's own request. Where reasonably possible, FNGo will inform the seller of the reason for suspension/deactivation. Approved products already live may be hidden or removed as part of a suspension.
FNGo विक्रेता का खाता निलंबित या निष्क्रिय कर सकता है — कारणों में शामिल हैं बार-बार गुणवत्ता संबंधी शिकायतें, अनसुलझे विवाद, गलत कीमत/स्टॉक, expired दस्तावेज़, धोखाधड़ी, या स्वयं विक्रेता के अनुरोध पर। जहाँ उचित रूप से संभव हो, FNGo विक्रेता को निलंबन/समाप्ति का कारण बताएगा। निलंबन के दौरान पहले से live approved उत्पाद छुपाए या हटाए जा सकते हैं।

12. Independent Relationship / स्वतंत्र संबंध
The seller operates as an independent business and not as an employee or agent of FNGo, unless a separate written agreement states otherwise. The seller is responsible for their own business's taxes, licences, and compliance.
जब तक कोई अलग लिखित समझौता कुछ और न कहे, विक्रेता एक स्वतंत्र व्यवसाय के रूप में कार्य करता है, FNGo के कर्मचारी या एजेंट के रूप में नहीं। विक्रेता अपने व्यवसाय के करों, लाइसेंसों, और अनुपालन के लिए स्वयं जिम्मेदार है।

13. Personal Data & Privacy / व्यक्तिगत डेटा एवं गोपनीयता
FNGo may process the seller's data — such as mobile number, shop/location details, documents, and order/earnings history — to provide the service, for verification, support, and legal compliance.
FNGo विक्रेता के डेटा — जैसे मोबाइल नंबर, दुकान/स्थान विवरण, दस्तावेज़, और ऑर्डर/कमाई इतिहास — को सेवा प्रदान करने, सत्यापन, सहायता और कानूनी अनुपालन के लिए संसाधित कर सकता है।

14. Grievance & Dispute Resolution / शिकायत एवं विवाद समाधान
A seller can raise a complaint or dispute (including about a refund deduction) through the app's Help/Support option or by contacting FNGo directly. FNGo should acknowledge and work toward resolving genuine complaints within a reasonable time as per its published policy.
विक्रेता ऐप के Help/Support विकल्प के माध्यम से या सीधे FNGo से संपर्क करके शिकायत या विवाद (रिफंड कटौती सहित) दर्ज कर सकता है। FNGo को वास्तविक शिकायतों को स्वीकार करना और अपनी प्रकाशित नीति के अनुसार उचित समय में हल करने की दिशा में काम करना चाहिए।

15. Changes to Terms / शर्तों में परिवर्तन
FNGo may update these terms from time to time; continued use of the Seller app after an update means the seller accepts the revised terms.
FNGo समय-समय पर इन शर्तों को अपडेट कर सकता है; अपडेट के बाद Seller ऐप का उपयोग जारी रखने का अर्थ है कि विक्रेता संशोधित शर्तों को स्वीकार करता है।
